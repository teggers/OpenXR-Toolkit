name: LMU experimental Windows DLL

on:
  push:
    branches: [codex/lmu-eye-target-mapping]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'

      - name: Build and run ownership tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ tools not found' }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          & .\scripts\Build-LmuExperiment.ps1 *>&1 | Tee-Object -FilePath build.log

      - name: Package replacement DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item bin/x64/Release/XR_APILAYER_MBUCCHIA_toolkit.dll artifact/
          Copy-Item bin/x64/Release/XR_APILAYER_MBUCCHIA_toolkit.pdb artifact/
          Copy-Item docs/LMU-experiment.md artifact/README.md
          Copy-Item docs/LMU-menu-diagnostics.md artifact/START-HERE.md
          Copy-Item scripts/Set-LmuEyeTargetMode.ps1 artifact/
          Copy-Item LICENSE artifact/
          Copy-Item version.info artifact/
          Get-FileHash artifact/XR_APILAYER_MBUCCHIA_toolkit.dll -Algorithm SHA256 |
            Format-List | Out-File artifact/SHA256.txt
          "Source commit: $env:GITHUB_SHA" | Out-File artifact/BUILD.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenXR-Toolkit-LMU-experiment-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: LMU-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
